name: Verify
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . jsonschema
      - run: python -m unittest discover -s tests -v
  checkout:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    defaults:
      run:
        shell: bash
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install uv==0.9.18
          echo "UV_CACHE_DIR=$RUNNER_TEMP/planner-uv-cache" >> "$GITHUB_ENV"
      - name: Run the README command in a clean checkout
        run: |
          test ! -d .venv
          uv lock --check
          uv run --locked schedule-plan --demo | python tools/check_demo_result.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Pipe the fixture through the agent command in a fresh shell
        run: |
          uv run --locked schedule-plan - --brief --compare-moves < src/scheduling_planner/data/demo.json | python tools/check_demo_result.py
      - name: Run offline after first setup
        run: uv run --offline --locked schedule-plan --demo | python tools/check_demo_result.py
      - name: Exercise the platform launcher
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            py run.py --demo | python tools/check_demo_result.py
          else
            python3 run.py --demo | python tools/check_demo_result.py
          fi
  older-python:
    runs-on: ubuntu-latest
    container: python:3.10-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bootstrap from Python 3.10 without uv or a supported interpreter
        shell: bash
        run: |
          for command in uv python3.11 python3.12 python3.13 python3.14; do
            if command -v "$command"; then exit 1; fi
          done
          python -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          python run.py --demo | python tools/check_demo_result.py
          UV_OFFLINE=1 python run.py --demo | python tools/check_demo_result.py
  distribution:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare matching Python wheels for the release checks
        run: |
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse" ".[dev]" "setuptools>=77" wheel
          echo "PIP_FIND_LINKS=$RUNNER_TEMP/wheelhouse" >> "$GITHUB_ENV"
          echo "PIP_NO_INDEX=1" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=1" >> "$GITHUB_ENV"
      - name: Run the native planner from a fresh clone with the package index disabled
        run: |
          git clone --quiet . "$RUNNER_TEMP/clone"
          cd "$RUNNER_TEMP/clone"
          python3 run.py --demo > "$RUNNER_TEMP/first-run.json"
          python3 tools/check_demo_result.py "$RUNNER_TEMP/first-run.json"
          python3 run.py --demo | python3 tools/check_demo_result.py
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python tools/eval_agent.py
      - run: python tools/refresh_demo.py --check
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_release.py dist
      - name: Exercise the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          . "$RUNNER_TEMP/wheel-env/bin/activate"
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pip check
          python -m pip install "jsonschema>=4.20,<5"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -t "$GITHUB_WORKSPACE"
          schedule-plan --demo | python "$GITHUB_WORKSPACE/tools/check_demo_result.py"
          python -m scheduling_planner --demo | python "$GITHUB_WORKSPACE/tools/check_demo_result.py"
          schedule-plan "$GITHUB_WORKSPACE/sample.json" > /dev/null
          schedule-plan --rules-file "$GITHUB_WORKSPACE/examples/team_rules.py" "$GITHUB_WORKSPACE/examples/release-review.json" > /dev/null
          schedule-plan --advise --profile "$GITHUB_WORKSPACE/examples/team-profile.json" --heuristics-file "$GITHUB_WORKSPACE/examples/team_heuristics.py" "$GITHUB_WORKSPACE/sample.json" > /dev/null
