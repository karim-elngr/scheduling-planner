<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Calendar proposal · Scheduling Planner</title>
<style>{{PLANNER_CSS}}</style>
<style>{{REVIEW_GRID_CSS}}</style>
<style>
.review .date {display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:.5rem .85rem}
.review select {font:inherit;color:var(--deep);background-color:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:.32rem .4rem}
.review select:focus-visible {outline:3px solid #a04d14;outline-offset:2px}
.review .hero h1 {text-wrap:balance}
.review .picks {grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))}
.review .candidate {min-width:0}
.review .candidate-time {overflow-wrap:anywhere}
.review .cal-top {align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:10px}
.mode-switch {display:inline-flex;gap:2px;padding:3px;background:var(--tint);border-radius:7px}
.mode-switch button {background:transparent;color:var(--muted);border-radius:5px;min-height:30px;padding:4px 10px;font-size:.77rem;font-weight:600}
.mode-switch button[aria-pressed=true] {background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px #19352d29}
.scope-note {margin:0 18px 8px;color:var(--muted);font-size:.78rem}
.grid-filter {display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.77rem}
.grid-filter input {accent-color:var(--deep)}
.grid-tools {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.review .inspect {overflow-wrap:anywhere}
.review .inspect ul:empty {display:none}
.change-title,.change-time {display:block}
.change-time {color:var(--muted);font-variant-numeric:tabular-nums}
.review .reference {padding:0;overflow:hidden}
.review .reference details {padding:12px 16px}
.review .reference details+details {border-top:1px solid var(--line)}
.review .reference table {width:100%;font-variant-numeric:tabular-nums}
.review .reference th,.review .reference td {vertical-align:top;border-bottom:1px solid var(--line)}
.review .reference th {color:var(--ink)}
.review .reference th button {background:var(--tint);border-radius:4px;padding:3px 8px;font:inherit}
.table-scroll {overflow:auto}
.review .reference ul {margin:7px 0;padding-left:1.25rem}
.review .handoff pre {white-space:pre-wrap;max-height:none;font:inherit;line-height:1.55;border-radius:6px}
.review #choose,.review #compare-time {width:100%}
@media(max-width:580px){
  .review .picks {grid-template-columns:repeat(auto-fit,minmax(min(100%,6rem),1fr))}
  .review .candidate-time {font-size:1.13rem}
  .review .date {gap:.2rem .45rem}
  .review .brand {white-space:nowrap}
  .review .cal-top {align-items:flex-start}
  .review .grid-tools {gap:5px}
  .review .grid-filter {font-size:.71rem}
  .review .mode-switch button {padding:4px 7px}
}
@media print {#picks,#view-mode,.buttons,.export,.grid-filter {display:none}}
</style>
</head>
<body class="review">
<div class="shell">
<header class="brandbar">{{PLANNER_BRAND}}<div class="date"><span id="date"></span>
<label id="zone-label"><span class="sr">Display timezone</span><select id="zone"></select></label></div></header>
<main>
<header class="hero"><h1 id="headline">Calendar proposal</h1><p id="subtitle"></p></header>
<noscript>Enable JavaScript to see the saved schedule and compare options.</noscript>
<div class="picks" id="picks" aria-label="Scheduling options" role="group" hidden></div>
<div class="workbench">
<section class="calendar" aria-labelledby="calendar-title">
<header class="cal-top"><h2 id="calendar-title">People’s calendars</h2>
<div class="grid-tools"><label class="grid-filter" id="filter-label" hidden><input type="checkbox" id="filter">Changes only</label>
<div class="mode-switch" id="view-mode" role="group" aria-label="Calendar view">
<button type="button" data-mode="current">Current</button><button type="button" data-mode="proposed">Proposed</button><button type="button" data-mode="compare">Compare</button>
</div></div></header>
<p id="scope-note" class="scope-note" hidden>Showing only the changes in the saved report.</p>
<div id="calendar-grid"></div>
</section>
<aside class="inspect" aria-labelledby="insight-title">
<div aria-live="polite"><div class="status" id="decision-state"></div><h2 id="insight-title"></h2>
<p id="insight-note"></p><div class="metric" id="metric"></div></div>
<ul id="changes"></ul><p class="question" id="question" hidden></p>
<div class="buttons"><button type="button" id="choose" class="btn primary">Review proposal</button><button type="button" id="compare-time" class="btn compare" hidden></button></div>
</aside></div>
<section class="handoff" id="handoff" aria-labelledby="handoff-title" hidden>
<div class="handoff-top"><h2 id="handoff-title" tabindex="-1">Proposal to share</h2><button type="button" id="close" class="btn close" aria-label="Close proposal">×</button></div>
<pre id="proposal"></pre><div class="export"><button type="button" class="btn primary" id="proposal-download">Save proposal as text</button></div>
</section>
<div class="reference">
<details id="comparison" hidden><summary>Compare move budgets</summary>
<div class="table-scroll"><table><thead><tr id="headers"></tr></thead><tbody id="caps"></tbody></table></div></details>
<details id="reasoning" hidden><summary>Scheduling evidence</summary><p id="evidence"></p><ul id="facts"></ul></details>
<details id="profiles" hidden><summary>Roster hours and weekends</summary><ul id="explainers"></ul></details>
</div>
</main></div>
<script id="calendar-data" type="application/json">{{CALENDAR_DATA}}</script>
<script>{{PLANNER_UI_JS}}</script>
<script>{{REVIEW_GRID_JS}}</script>
<script>{{REVIEW_JS}}</script>
</body></html>
