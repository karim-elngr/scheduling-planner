[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-scheduling-planner"
dynamic = ["version"]
description = "Local multi-party meeting rescheduling with extensible Google OR-Tools CP-SAT models"
readme = "docs/package-description.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ortools==9.15.6755"]

[project.urls]
Repository = "https://github.com/karim-elngr/scheduling-planner"
Issues = "https://github.com/karim-elngr/scheduling-planner/issues"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "jsonschema>=4.20,<5", "ruff>=0.9,<1", "twine>=6,<7"]

[project.scripts]
schedule-plan = "scheduling_planner.cli:main"

[tool.setuptools.dynamic]
version = {attr = "scheduling_planner._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scheduling_planner = ["schemas/*.json", "data/*.json", "data/*.html", "data/*.css", "data/*.js"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
